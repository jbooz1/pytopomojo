[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytopomojo"
version = "0.0.0"  # Will be replaced by GitHub tag at build time
description = "Python wrapper for TopoMojo API"
authors = [{ name = "Jarrett Booz" }]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25",
    "pycdlib>=1.14",
]

[project.optional-dependencies]
docs = ["pdoc>=15"]

[project.urls]
Homepage = "https://github.com/jbooz1/pytopomojo"
Documentation = "https://jbooz1.github.io/pytopomojo/"
Source = "https://github.com/jbooz1/pytopomojo"
